<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rebolt Kaly">
  <meta name="theme-color" content="#0a0f0a">
  <title>Rebolt Kalymnos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0f0a; --surface:#111811; --surface2:#182018; --border:#2a3d2a;
      --accent:#7eff6a; --accent2:#ff9f1c; --accent3:#4ecdc4;
      --text:#e8ede8; --text-dim:#7a9a7a; --text-muted:#4a6a4a;
      --danger:#ff4d4d; --good:#7eff6a;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Space Mono',monospace; min-height:100dvh; overflow-x:hidden; }

    header { position:sticky; top:0; z-index:100; background:rgba(10,15,10,0.96); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:12px 16px; }
    .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .logo { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; letter-spacing:1px; line-height:1; }
    .logo span { color:var(--accent); }
    .sync-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); font-family:'Space Mono',monospace; font-size:11px; padding:6px 12px; cursor:pointer; border-radius:4px; display:flex; align-items:center; gap:6px; transition:all 0.2s; }
    .sync-btn:hover { border-color:var(--accent); color:var(--accent); }
    .sync-btn.busy { opacity:0.5; pointer-events:none; }
    .sync-btn.busy .si { animation:spin 1s linear infinite; }
    .si { display:inline-block; font-size:14px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .search-wrap { position:relative; }
    .search-input { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:'Space Mono',monospace; font-size:13px; padding:9px 36px 9px 12px; border-radius:4px; outline:none; transition:border-color 0.2s; }
    .search-input:focus { border-color:var(--accent); }
    .search-input::placeholder { color:var(--text-muted); }
    .clr { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px; display:none; }
    .clr.v { display:block; }

    .filters { display:flex; gap:8px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); }
    .filters::-webkit-scrollbar { display:none; }
    .chip { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.5px; padding:5px 12px; border-radius:20px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
    .chip.on { background:var(--accent); border-color:var(--accent); color:var(--bg); }

    .bar { display:flex; align-items:stretch; border-bottom:1px solid var(--border); background:var(--surface); }
    .stat { padding:8px 14px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:2px; }
    .sn { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; color:var(--accent); line-height:1; }
    .sl { font-size:9px; color:var(--text-muted); letter-spacing:0.5px; text-transform:uppercase; }
    .age { flex:1; padding:8px 12px; font-size:10px; color:var(--text-muted); display:flex; align-items:center; justify-content:flex-end; text-align:right; line-height:1.4; }
    .age.fresh { color:var(--good); }
    .age.stale { color:var(--accent2); }

    /* sync notice - shown when opened locally */
    .sync-notice { display:none; padding:10px 16px; background:#ff9f1c11; border-bottom:1px solid #ff9f1c33; font-size:11px; color:var(--accent2); line-height:1.6; }
    .sync-notice a { color:var(--accent3); }
    .sync-notice.show { display:block; }

    .content { padding:0 0 80px; }
    .sg { border-bottom:1px solid var(--border); }
    .sh { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; cursor:pointer; background:var(--surface); user-select:none; transition:background 0.15s; }
    .sh:hover { background:var(--surface2); }
    .sn2 { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:1px; text-transform:uppercase; color:var(--accent3); }
    .sm { display:flex; align-items:center; gap:8px; }
    .sc { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--text-muted); }
    .ch { color:var(--text-muted); font-size:11px; transition:transform 0.2s; }
    .sg.open .ch { transform:rotate(180deg); }
    .rl { display:none; }
    .sg.open .rl { display:block; }

    .rc { padding:11px 16px; border-top:1px solid var(--border); display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:start; transition:background 0.1s; }
    .rc:hover { background:var(--surface); }
    .rn { font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:16px; letter-spacing:0.5px; color:var(--text); }
    .ra { font-size:11px; color:var(--text-dim); line-height:1.4; }
    .rp { font-size:10px; color:var(--text-muted); }
    .rb { grid-row:1/4; align-self:center; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    .by { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; color:var(--accent2); }
    .bt { font-size:9px; letter-spacing:0.5px; text-transform:uppercase; padding:2px 6px; border-radius:3px; font-family:'Barlow Condensed',sans-serif; font-weight:700; }
    .bt.full    { background:#7eff6a22; color:var(--good);    border:1px solid #7eff6a44; }
    .bt.partial { background:#ff9f1c22; color:var(--accent2); border:1px solid #ff9f1c44; }
    .bt.anchor  { background:#4ecdc422; color:var(--accent3); border:1px solid #4ecdc444; }
    .bt.other   { background:#ffffff11; color:var(--text-dim);border:1px solid #ffffff22; }

    .empty { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:12px; }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:12px; padding:10px 18px; border-radius:6px; z-index:999; transition:transform 0.3s; white-space:nowrap; max-width:90vw; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast.ok  { border-color:var(--accent); color:var(--accent); }
    .toast.err { border-color:var(--danger); color:var(--danger); }
    mark { background:#7eff6a33; color:var(--accent); border-radius:2px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">REBOLT <span>KALY</span></div>
    <button class="sync-btn" id="syncBtn" onclick="syncData()">
      <span class="si">⟳</span>
      <span id="syncLabel">REFRESH</span>
    </button>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="search"
      placeholder="Route name, sector, or bolter…"
      oninput="onSearch(this.value)" autocomplete="off" spellcheck="false">
    <button class="clr" id="clr" onclick="clearSearch()">✕</button>
  </div>
</header>

<div class="filters">
  <div class="chip on"  onclick="setFilter('all',this)">ALL</div>
  <div class="chip" onclick="setFilter('full',this)">FULLY REBOLTED</div>
  <div class="chip" onclick="setFilter('partial',this)">PARTIAL</div>
  <div class="chip" onclick="setFilter('anchor',this)">ANCHOR ONLY</div>
  <div class="chip" onclick="setFilter('2024',this)">2024</div>
  <div class="chip" onclick="setFilter('2023',this)">2023</div>
  <div class="chip" onclick="setFilter('2022',this)">2022</div>
  <div class="chip" onclick="setFilter('2016',this)">2015/16</div>
</div>

<div class="bar">
  <div class="stat"><div class="sn" id="sR">0</div><div class="sl">Shown</div></div>
  <div class="stat"><div class="sn" id="sS">0</div><div class="sl">Sectors</div></div>
  <div class="stat"><div class="sn" id="sF">0</div><div class="sl">Rebolted</div></div>
  <div class="age" id="age"></div>
</div>

<div class="sync-notice" id="syncNotice">
  ⚠ REFRESH only works when hosted online (CORS restriction).<br>
  Drag the folder to <a href="https://app.netlify.com/drop" target="_blank">netlify.com/drop</a> for a free URL — then REFRESH works everywhere including your phone.
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

let all = [], filt = 'all', q = '';

(function init() {
  const s = tryLoad();
  all = s || BUILTIN;
  setAgeDisplay(s ? localStorage.getItem(SKEY) : null);
  render();
  // Show notice if running from file://
  if (location.protocol === 'file:') {
    document.getElementById('syncNotice').classList.add('show');
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

function tryLoad() {
  try { const r=localStorage.getItem(RKEY); return r?JSON.parse(r):null; } catch{return null;}
}

async function syncData() {
  const btn = document.getElementById('syncBtn');
  const lbl = document.getElementById('syncLabel');
  btn.classList.add('busy'); lbl.textContent = 'SYNCING…';
  try {
    const res = await fetch('https://climbkalymnos.com/', {signal:AbortSignal.timeout(20000)});
    if (!res.ok) throw new Error('HTTP '+res.status);
    const html = await res.text();
    const routes = parseHTML(html);
    if (routes.length < 30) throw new Error('Only '+routes.length+' routes found');
    // Merge with builtin 2016 data (keep 2016 entries, update with fresh maintenance)
    const merged = mergeRoutes(BUILTIN.filter(r=>r.year==='2016'), routes);
    localStorage.setItem(RKEY, JSON.stringify(merged));
    const now = new Date().toISOString();
    localStorage.setItem(SKEY, now);
    all = merged;
    render();
    setAgeDisplay(now);
    toast('✓ Refreshed — '+merged.length+' routes total', 'ok');
  } catch(e) {
    toast('Refresh failed: '+e.message, 'err');
    console.error(e);
  }
  btn.classList.remove('busy'); lbl.textContent = 'REFRESH';
}

function mergeRoutes(base, fresh) {
  const seen = new Set(fresh.map(r=>r.sector.toLowerCase()+'|'+r.name.toLowerCase()));
  const out = [...fresh];
  for (const r of base) {
    if (!seen.has(r.sector.toLowerCase()+'|'+r.name.toLowerCase())) out.push(r);
  }
  return out;
}

function parseHTML(html) {
  const routes = [];
  html = html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'');
  const re = /<li>([\s\S]*?)<\/li>/gi; let m;
  while ((m=re.exec(html))!==null) {
    const t = m[1].replace(/<em>/gi,'(').replace(/<\/em>/gi,')').replace(/<[^>]+>/g,'')
      .replace(/&amp;/g,'&').replace(/&#8217;/g,"'").replace(/&nbsp;/g,' ')
      .replace(/\s+/g,' ').trim();
    const rm = t.match(/^(.+?):\s*Route\s+(.+?):\s*(.+?)\s*\(([^)]+)\)\s*\.?$/i);
    if (!rm) continue;
    const [,sec,name,action,dp] = rm;
    const pts = dp.split('/');
    routes.push({
      sector: sec.replace(/\s*\([^)]+\)\s*$/,'').trim(),
      name: name.trim(), action: action.trim(),
      date: pts[0].trim(), person: pts.slice(1).join('/').trim(),
      year: (pts[0].match(/20\d\d/)||[''])[0],
      type: classify(action)
    });
  }
  return routes;
}

function classify(a) {
  a = a.toLowerCase();
  if (/fully rebolted/.test(a)) return 'full';
  if (/partially rebolted|lower part/.test(a)) return 'partial';
  if (/rebolted/.test(a)) return 'full';
  if (/anchor|lower-off|lower off|biner|hanger|ring|chain/.test(a)) return 'anchor';
  return 'other';
}

function render() {
  let rows = all.filter(r => {
    if (filt==='all') return true;
    if (/^\d{4}$/.test(filt)) return r.year===filt;
    return r.type===filt;
  });
  if (q) rows = rows.filter(r =>
    r.name.toLowerCase().includes(q) || r.sector.toLowerCase().includes(q) ||
    r.person.toLowerCase().includes(q) || r.action.toLowerCase().includes(q));

  document.getElementById('sR').textContent = rows.length;
  document.getElementById('sS').textContent = new Set(rows.map(r=>r.sector)).size;
  document.getElementById('sF').textContent = rows.filter(r=>r.type==='full').length;

  const C = document.getElementById('content');
  if (!rows.length) { C.innerHTML='<div class="empty">No routes match</div>'; return; }

  const grp = {};
  for (const r of rows) (grp[r.sector]=grp[r.sector]||[]).push(r);
  const tl = {full:'FULL REBOLT',partial:'PARTIAL',anchor:'ANCHOR',other:'MAINTAINED'};

  C.innerHTML = Object.keys(grp).sort().map(sec => {
    const rs = grp[sec];
    return `<div class="sg open">
      <div class="sh" onclick="this.parentElement.classList.toggle('open')">
        <div class="sn2">${q?hl(sec):sec}</div>
        <div class="sm"><span class="sc">${rs.length}</span><span class="ch">▼</span></div>
      </div>
      <div class="rl">${rs.map(r=>`
        <div class="rc">
          <div class="rn">${q?hl(r.name):r.name}</div>
          <div class="ra">${q?hl(r.action):r.action}</div>
          ${r.person?`<div class="rp">by ${q?hl(r.person):r.person}</div>`:''}
          <div class="rb">
            ${r.year?`<div class="by">${r.year}</div>`:''}
            <div class="bt ${r.type}">${tl[r.type]||'OTHER'}</div>
          </div>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
}

function hl(s) {
  if(!s||!q) return s||'';
  return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}

function setFilter(f, chip) {
  filt=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  chip.classList.add('on');
  render();
}

function onSearch(v) {
  q=v.toLowerCase().trim();
  document.getElementById('clr').classList.toggle('v',v.length>0);
  render();
}

function clearSearch() {
  const i=document.getElementById('searchInput');
  i.value=''; onSearch(''); i.focus();
}

function setAgeDisplay(iso) {
  const el=document.getElementById('age');
  if (!iso) { el.textContent='Built-in · '+BUILTIN_DATE; el.className='age'; return; }
  const d=new Date(iso), days=Math.floor((Date.now()-d)/86400000);
  const ds=d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
  el.textContent = days<14 ? '✓ Updated '+ds : '⚠ '+ds;
  el.className='age '+(days<14?'fresh':'stale');
}

function toast(msg,type) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+(type||'');
  setTimeout(()=>el.classList.remove('show'),4000);
}
