<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0f0a">
  <title>Rebolt Kalymnos Offline</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f0a; --surface: #111811; --border: #2a3d2a;
      --accent: #7eff6a; --text: #e8ede8; --text-dim: #7a9a7a;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; margin: 0; }
    header { position: sticky; top: 0; z-index: 100; background: rgba(10, 15, 10, 0.95); border-bottom: 1px solid var(--border); padding: 12px; }
    .logo { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
    
    /* Search Bar */
    .search-wrap { position: relative; }
    .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; outline: none; }
    .search-input:focus { border-color: var(--accent); }

    /* Sector Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
    .sector-card { background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: 12px; text-align: center; cursor: pointer; }
    .sector-card:active { transform: scale(0.98); }
    .sector-name { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; display: block; margin-bottom: 4px; }
    .sector-count { font-size: 12px; color: var(--accent); font-weight: bold; }

    /* Route List */
    .route-list { padding-bottom: 80px; }
    .back-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 4px 12px; border-radius: 4px; margin-bottom: 12px; cursor: pointer; }
    .route-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .grade { background: var(--accent); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">REBOLT KALYMNOS <span>OFFLINE</span></div>
  <div class="search-wrap">
    <input type="text" id="search" class="search-input" placeholder="Fuzzy search routes or areas..." oninput="handleSearch(this.value)">
  </div>
</header>

<!-- View 1: Sector Tiles -->
<div id="sectorView" class="grid"></div>

<!-- View 2: Route Details -->
<div id="routeView" class="route-list hidden">
  <div style="padding: 16px;">
    <button class="back-btn" onclick="showSectors()">← ALL AREAS</button>
    <h2 id="currentAreaTitle" style="font-family: 'Barlow Condensed'; color: var(--accent);"></h2>
    <div id="routeContainer"></div>
  </div>
</div>

let areas = {};

// 1. Process data for tiles
function init() {
  ALL_ROUTES.forEach(r => {
    if (!areas[r.Area]) areas[r.Area] = [];
    areas[r.Area].push(r);
  });
  showSectors();
}

function showSectors() {
  document.getElementById('sectorView').classList.remove('hidden');
  document.getElementById('routeView').classList.add('hidden');
  const grid = document.getElementById('sectorView');
  grid.innerHTML = Object.keys(areas).sort().map(area => `
    <div class="sector-card" onclick="showRoutes('${area}')">
      <span class="sector-name">${area}</span>
      <span class="sector-count">${areas[area].length} ROUTES</span>
    </div>
  `).join('');
}

function showRoutes(areaName) {
  document.getElementById('sectorView').classList.add('hidden');
  document.getElementById('routeView').classList.remove('hidden');
  document.getElementById('currentAreaTitle').innerText = areaName;
  renderRouteList(areas[areaName]);
}

function renderRouteList(data) {
  const container = document.getElementById('routeContainer');
  container.innerHTML = data.map(r => `
    <div class="route-item">
      <div>
        <div style="font-weight: bold;">${r.Route}</div>
        <div style="font-size: 10px; color: var(--text-dim);">${r['Bolt material'] || 'Unknown'} • ${r['Last updated'] || 'N/A'}</div>
      </div>
      <div class="grade">${r.Grade}</div>
    </div>
  `).join('');
}

// 2. Fuzzy Search Logic
function handleSearch(query) {
  if (!query) {
    showSectors();
    return;
  }
  
  document.getElementById('sectorView').classList.add('hidden');
  document.getElementById('routeView').classList.remove('hidden');
  document.getElementById('currentAreaTitle').innerText = "Search Results";

  const q = query.toLowerCase();
  const filtered = ALL_ROUTES.filter(r => {
    // Simple fuzzy logic: check if name, area, or grade contains the string
    return r.Route.toLowerCase().includes(q) || 
           r.Area.toLowerCase().includes(q) || 
           (r.Grade && r.Grade.toLowerCase().includes(q));
  }).slice(0, 100); // Limit results for performance

  renderRouteList(filtered);
}

init();
